<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0B0D0C" rx="64"/>
  <defs>
    <linearGradient id="copperGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9722A"/>
      <stop offset="100%" stop-color="#E0A34E"/>
    </linearGradient>
  </defs>
  <!-- Africa-inspired circuit/API icon -->
  <g transform="translate(128, 128)" fill="none">
    <!-- Central node representing connectivity -->
    <circle cx="128" cy="128" r="24" fill="url(#copperGradient)"/>
    
    <!-- Connection lines (representing API infrastructure) -->
    <path d="M128 96V64" stroke="#C9722A" stroke-width="8" stroke-linecap="round"/>
    <path d="M128 160V192" stroke="#C9722A" stroke-width="8" stroke-linecap="round"/>
    <path d="M96 128H64" stroke="#C9722A" stroke-width="8" stroke-linecap="round"/>
    <path d="M160 128H192" stroke="#C9722A" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Outer nodes representing African regions -->
    <circle cx="64" cy="64" r="12" fill="#14171A" stroke="#C9722A" stroke-width="2"/>
    <circle cx="192" cy="64" r="12" fill="#14171A" stroke="#C9722A" stroke-width="2"/>
    <circle cx="64" cy="192" r="12" fill="#14171A" stroke="#C9722A" stroke-width="2"/>
    <circle cx="192" cy="192" r="12" fill="#14171A" stroke="#C9722A" stroke-width="2"/>
    
    <!-- Subtle circuit pattern overlay -->
    <path d="M96 96H160V160H96V96Z" stroke="#C9722A" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="128" cy="128" r="80" stroke="#C9722A" stroke-width="1" stroke-opacity="0.1" fill="none"/>
    
    <!-- API endpoint dots -->
    <circle cx="224" cy="100" r="6" fill="#5FA97C"/>
    <circle cx="224" cy="156" r="6" fill="#D9B44E"/>
  </g>
</svg>